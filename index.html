<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 수학 객관식 퀴즈 시스템</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root { --primary: #007bff; --teacher: #2d3436; --bg: #f4f7f9; --red: #e21b3c; --blue: #1368ce; --yellow: #d89e00; --green: #26890c; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; padding: 20px; text-align: center; }
        .view { display: none; max-width: 850px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .active { display: block; }
        
        /* 유저 리스트 */
        #user-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin: 20px 0; }
        .user-circle { width: 100px; height: 100px; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; animation: bounce 2s infinite ease-in-out; overflow-wrap: break-word; padding: 10px; text-align: center; line-height: 1.2; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* 입력 및 버튼 */
        input, select, textarea { padding: 12px; width: 95%; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 1rem; }
        button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-dark { background: var(--teacher); color: white; }
        .btn-red { background: #ff4757; color: white; }

        /* 퀴즈 레이아웃 */
        .quiz-item { border: 1px solid #eee; padding: 20px; margin-bottom: 20px; border-radius: 15px; text-align: left; background: #fafafa; }
        .opt-input { width: 45% !important; margin: 5px !important; display: inline-block; }
        #problem-area { font-size: 2rem; margin: 30px 0; padding: 30px; background: #f8f9fa; border-radius: 15px; border-left: 10px solid var(--primary); }
        
        /* 학생용 선택 버튼 그리드 */
        .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .choice-btn { height: 100px; font-size: 1.2rem; color: white; border-radius: 12px; transition: 0.2s; }
        .choice-btn:active { transform: scale(0.95); }
        .c0 { background: var(--red); } .c1 { background: var(--blue); } .c2 { background: var(--yellow); } .c3 { background: var(--green); }
    </style>
</head>
<body>

<div id="view-entry" class="view active">
    <h1>🎓 AI 수학 객관식 퀴즈</h1>
    <div id="teacher-entry-options" style="display:none; margin-bottom: 20px;">
        <button class="btn-dark" style="background:#2ecc71" onclick="showView('view-quiz-manager')">퀴즈 세트 제작/관리</button>
    </div>
    <div id="entry-form">
        <input type="text" id="input-room" placeholder="방 번호 입력">
        <div id="student-inputs-area">
            <input type="text" id="input-name" placeholder="닉네임 입력 (최대 10자)" maxlength="10">
        </div>
        <div id="teacher-set-selection" style="display:none;">
            <p>사용할 퀴즈 세트 선택:</p>
            <select id="select-quiz-set"><option value="">퀴즈를 먼저 제작하세요</option></select>
        </div>
        <br>
        <button id="btn-join" class="btn-blue" onclick="handleEntry()">수업 참여하기</button>
    </div>
</div>

<div id="view-quiz-manager" class="view">
    <h2>📝 객관식 퀴즈 제작</h2>
    <input type="text" id="quiz-set-title" placeholder="퀴즈 세트 제목 (예: 고차방정식 기초)">
    <div id="quiz-questions-input">
        <div class="quiz-item">
            <strong>문제 1 (LaTeX 가능):</strong>
            <textarea class="q-text" rows="2" placeholder="예: \( x^2 - 5x + 6 = 0 \)의 해는?"></textarea>
            <div>
                <input type="text" class="q-opt" placeholder="보기 1 (정답)"> 
                <input type="text" class="q-opt" placeholder="보기 2">
                <input type="text" class="q-opt" placeholder="보기 3">
                <input type="text" class="q-opt" placeholder="보기 4">
            </div>
        </div>
    </div>
    <button class="btn-blue" onclick="addQuestionInput()">+ 문제 추가</button>
    <button class="btn-dark" style="background:#2ecc71" onclick="saveQuizSet()">퀴즈 세트 저장</button>
    <button class="btn-dark" onclick="showView('view-entry')">뒤로 가기</button>
    <hr>
    <h3>저장된 퀴즈 목록</h3>
    <div id="saved-quiz-list"></div>
</div>

<div id="view-lobby" class="view">
    <h2>🏫 <span id="display-room"></span>번 강의실 (대기중)</h2>
    <div id="user-list"></div>
    <button class="btn-red" onclick="leaveRoom()">방 나가기</button>
</div>

<div id="view-class" class="view">
    <div id="problem-area">문제를 기다리는 중...</div>
    <div id="choice-area" class="choice-grid">
        <button class="choice-btn c0" onclick="submitChoice(0)">1번</button>
        <button class="choice-btn c1" onclick="submitChoice(1)">2번</button>
        <button class="choice-btn c2" onclick="submitChoice(2)">3번</button>
        <button class="choice-btn c3" onclick="submitChoice(3)">4번</button>
    </div>
    <button class="btn-red" onclick="leaveRoom()" style="margin-top:30px;">수업 나가기</button>
</div>

<div id="teacher-controls" style="display:none; position:fixed; bottom:0; left:0; right:0; background:#2d3436; padding:15px; color:white; z-index:1000;">
    <strong>👨‍🏫 교사 제어:</strong>
    <button class="btn-dark" onclick="updateStatus('lobby')">대기실</button>
    <span id="quiz-navigation"></span>
    <button class="btn-red" onclick="resetRoom()">방 초기화</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 1. 본인의 Firebase 설정값을 여기에 꼭 넣으세요!
    const firebaseConfig = {
  apiKey: "AIzaSyD1YUdjxb-a9nMog4OVOkg8W9UyvrQ6NSk",
  authDomain: "ai-math-quiz2026.firebaseapp.com",
  databaseURL: "https://ai-math-quiz2026-default-rtdb.firebaseio.com/",
  projectId: "ai-math-quiz2026",
  storageBucket: "ai-math-quiz2026.firebasestorage.app",
  messagingSenderId: "184710615493",
  appId: "1:184710615493:web:7a86fa99270f51ccc37bac"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const isTeacher = new URLSearchParams(window.location.search).get('role') === 'teacher';
    let currentRoom = "", myName = "선생님", myKey = "";

    if (isTeacher) {
        document.getElementById('teacher-entry-options').style.display = 'block';
        document.getElementById('student-inputs-area').style.display = 'none';
        document.getElementById('teacher-set-selection').style.display = 'block';
        document.getElementById('btn-join').innerText = "방 생성하기";
        document.getElementById('teacher-controls').style.display = 'block';
        loadQuizSets();
    }

    window.showView = (id) => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };

    window.addQuestionInput = () => {
        const div = document.createElement('div');
        div.className = 'quiz-item';
        div.innerHTML = `<strong>추가 문제:</strong><textarea class="q-text" rows="2"></textarea><div><input type="text" class="q-opt" placeholder="보기 1 (정답)"> <input type="text" class="q-opt" placeholder="보기 2"> <input type="text" class="q-opt" placeholder="보기 3"> <input type="text" class="q-opt" placeholder="보기 4"></div>`;
        document.getElementById('quiz-questions-input').appendChild(div);
    };

    window.saveQuizSet = () => {
        const title = document.getElementById('quiz-set-title').value;
        const questions = Array.from(document.querySelectorAll('.quiz-item')).map(item => {
            const opts = Array.from(item.querySelectorAll('.q-opt')).map(o => o.value);
            return { text: item.querySelector('.q-text').value, options: opts };
        }).filter(q => q.text && q.options[0]);

        if(!title || questions.length === 0) return alert("제목과 문제를 입력하세요.");
        push(ref(db, `quizSets`), { title, questions }).then(() => { alert("저장 완료!"); loadQuizSets(); });
    };

    function loadQuizSets() {
        onValue(ref(db, `quizSets`), (snap) => {
            const select = document.getElementById('select-quiz-set');
            const list = document.getElementById('saved-quiz-list');
            select.innerHTML = ""; list.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([id, s]) => {
                select.innerHTML += `<option value="${id}">${s.title}</option>`;
                list.innerHTML += `<div style="margin-bottom:8px;">• ${s.title} <button onclick="deleteQuizSet('${id}')" style="padding:2px 5px; background:#ff4757; color:white; border-radius:4px;">삭제</button></div>`;
            });
        });
    }
    window.deleteQuizSet = (id) => remove(ref(db, `quizSets/${id}`));

    window.handleEntry = function() {
        currentRoom = document.getElementById('input-room').value;
        if(!currentRoom) return alert("방 번호 입력!");
        if(isTeacher) {
            const setId = document.getElementById('select-quiz-set').value;
            if(!setId) return alert("세트 선택!");
            onValue(ref(db, `quizSets/${setId}`), (snap) => {
                const qData = snap.val();
                set(ref(db, `rooms/${currentRoom}`), { status: 'lobby', quizData: qData });
                setupQuizNav(qData.questions);
            }, { onlyOnce: true });
            showView('view-lobby'); startSync();
        } else {
            myName = document.getElementById('input-name').value;
            if(!myName) return alert("이름 입력!");
            const uRef = push(ref(db, `rooms/${currentRoom}/users`));
            myKey = uRef.key;
            onDisconnect(ref(db, `rooms/${currentRoom}/users/${myKey}`)).remove();
            set(uRef, { name: myName });
            showView('view-lobby'); startSync();
        }
    };

    function setupQuizNav(qs) {
        const nav = document.getElementById('quiz-navigation'); nav.innerHTML = "";
        qs.forEach((q, i) => {
            const b = document.createElement('button'); b.innerText = `${i+1}번`; b.className = "btn-blue";
            b.onclick = () => set(ref(db, `rooms/${currentRoom}`), { status: 'class', problem: q, probIdx: i });
            nav.appendChild(b);
        });
    }

    function startSync() {
        onValue(ref(db, `rooms/${currentRoom}/status`), (snap) => {
            const s = snap.val();
            if(s === 'lobby') showView('view-lobby');
            else if(s === 'class') showView('view-class');
        });
        const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#FDCB6E', '#6C5CE7', '#2ecc71'];
        onValue(ref(db, `rooms/${currentRoom}/users`), (snap) => {
            const list = document.getElementById('user-list'); list.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([k, u]) => {
                const d = document.createElement('div'); d.className = 'user-circle';
                d.style.backgroundColor = colors[k.charCodeAt(k.length-1) % colors.length];
                d.innerText = u.name; list.appendChild(d);
            });
        });
        onValue(ref(db, `rooms/${currentRoom}/problem`), (snap) => {
            const p = snap.val();
            if(p) {
                document.getElementById('problem-area').innerHTML = p.text;
                const btns = document.querySelectorAll('.choice-btn');
                btns.forEach((b, i) => { b.innerText = p.options[i] || "보기 없음"; });
                MathJax.typesetPromise();
            }
        });
    }

    window.updateStatus = (s) => set(ref(db, `rooms/${currentRoom}/status`), s);
    window.leaveRoom = () => { if(confirm("퇴장?")) { if(myKey) remove(ref(db, `rooms/${currentRoom}/users/${myKey}`)); location.reload(); }};
    window.resetRoom = () => { if(confirm("초기화?")) remove(ref(db, `rooms/${currentRoom}`)).then(() => location.reload()); };
    window.submitChoice = (idx) => {
        push(ref(db, `rooms/${currentRoom}/results`), { name: myName, choice: idx + 1, time: Date.now() });
        alert(`${idx + 1}번 선택 완료!`);
    };
</script>
</body>
</html>
