<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 수학 객관식 퀴즈 시스템</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root { --primary: #3b82f6; --teacher: #1e293b; --bg: #f8fafc; --red: #ef4444; --blue: #3b82f6; --yellow: #f59e0b; --green: #10b981; --border: #e2e8f0; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; padding: 20px; text-align: center; color: #334155; }
        .view { display: none; max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .active { display: block; }
        .role-selection-wrapper { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; }
        .role-card { flex: 1; padding: 25px; border: 2px solid var(--border); border-radius: 16px; cursor: pointer; transition: 0.3s; background: white; display: flex; flex-direction: column; align-items: center; gap: 15px; position: relative; }
        .role-card img { width: 80px; height: 80px; object-fit: contain; }
        .role-card span { font-weight: bold; font-size: 1.1rem; color: #64748b; }
        .role-card.selected { border-color: var(--primary); background: #eff6ff; }
        .role-card.selected span { color: var(--primary); }
        .role-card.selected::after { content: '✓'; position: absolute; top: 10px; right: 15px; color: var(--primary); font-size: 1.5rem; font-weight: bold; }
        .disabled-section { filter: blur(3px); opacity: 0.4; pointer-events: none; transition: 0.4s; }
        .enabled-section { filter: blur(0); opacity: 1; pointer-events: auto; }
        input, select, textarea { padding: 14px; width: 100%; margin-bottom: 12px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 1rem; box-sizing: border-box; background: #f8fafc; }
        button { padding: 14px 24px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; margin: 4px; font-size: 1rem; transition: 0.2s; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-dark { background: var(--teacher); color: white; }
        .btn-red { background: var(--red); color: white; }
        .btn-green { background: var(--green); color: white; }
        #problem-area { font-size: 1.6rem; margin: 24px 0; padding: 30px; background: #f1f5f9; border-radius: 12px; border-left: 8px solid var(--primary); text-align: left; }
        .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; position: relative; }
        .choice-btn { height: 90px; font-size: 1.2rem; color: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .c0 { background: #ff5f5f; } .c1 { background: #5f99ff; } .c2 { background: #ffbc5f; } .c3 { background: #5fff8b; }
        #wrong-x-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 10; justify-content: center; align-items: center; font-size: 5rem; color: var(--red); font-weight: bold; }
        .timer-container { display: flex; align-items: center; margin-top: 35px; padding: 15px 25px; background: #f1f5f9; border-radius: 15px; }
        .bomb-icon { font-size: 2rem; margin-right: 15px; }
        .shake-small { animation: shake 0.3s infinite; }
        @keyframes shake { 0%, 100% {transform:translateX(0);} 25% {transform:translateX(-3px);} 75% {transform:translateX(3px);} }
        .rope-track { flex: 1; height: 10px; background: #cbd5e1; border-radius: 5px; overflow: hidden; }
        .rope-burn { height: 100%; background: var(--yellow); width: 100%; transform-origin: left; }
        .timer-text { font-size: 1.1rem; font-weight: bold; margin-left: 16px; width: 45px; }
        .progress-board { display: flex; gap: 15px; overflow-x: auto; padding: 20px 0; min-height: 180px; }
        .prob-col { flex: 0 0 100px; background: #f8fafc; border-radius: 12px; padding: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; }
        .podium-container { display: flex; align-items: flex-end; justify-content: center; min-height: 250px; gap: 10px; margin-bottom: 30px; border-bottom: 2px solid var(--border); padding-bottom: 10px; overflow-x: auto; }
        .step { width: 100px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; color: white; border-radius: 12px 12px 0 0; padding: 15px 5px; text-align: center; }
        .step.first { height: 200px; background: #fbbf24; }
        .step.second { height: 150px; background: #94a3b8; }
        .step.third { height: 110px; background: #b45309; }
        .table-container { max-height: 250px; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; } th, td { padding: 15px; border-bottom: 1px solid #f1f5f9; }
    </style>
</head>
<body>

<div id="view-entry" class="view active">
    <h2 style="margin-bottom: 30px;">수학 객관식 퀴즈</h2>
    <div class="role-selection-wrapper">
        <div class="role-card" id="card-student" onclick="selectRole('student')">
            <img src="https://cdn-icons-png.flaticon.com/512/3449/3449692.png" alt="Student">
            <span>학생으로 참여</span>
        </div>
        <div class="role-card" id="card-teacher" onclick="selectRole('teacher')">
            <img src="https://cdn-icons-png.flaticon.com/512/1995/1995539.png" alt="Teacher">
            <span>교사로 관리</span>
        </div>
    </div>
    <button class="btn-dark" id="btn-apply-role" onclick="applyRole()">선택 완료 및 설정</button>
    <div id="password-area" style="display:none; margin: 20px 0;">
        <input type="password" id="teacher-pwd" placeholder="관리자 비밀번호 입력" style="width: calc(100% - 100px);">
        <button class="btn-blue" onclick="verifyPwd()">확인</button>
    </div>
    <hr style="margin: 30px 0; border: 0; border-top: 1px solid var(--border);">
    <div id="action-area" class="disabled-section">
        <div id="teacher-entry-options" style="display:none; margin-bottom: 20px;">
            <button class="btn-green" onclick="showView('view-quiz-manager')" style="width: 100%;">📝 퀴즈 세트 제작 및 관리</button>
        </div>
        <div id="entry-form">
            <input type="text" id="input-room" placeholder="방 번호를 입력하세요">
            <div id="student-inputs-area"><input type="text" id="input-name" placeholder="닉네임 입력 (최대 10자)" maxlength="10"></div>
            <div id="teacher-set-selection" style="display:none; text-align: left;">
                <label style="font-size: 0.85rem; font-weight: bold; color: #64748b;">퀴즈 세트 선택</label>
                <select id="select-quiz-set" style="margin-top: 5px;"></select>
            </div>
            <button id="btn-join" class="btn-blue" onclick="handleEntry()" style="width: 100%; margin-top: 10px;">입장하기</button>
        </div>
    </div>
</div>

<div id="view-quiz-manager" class="view">
    <h2>📝 퀴즈 제작</h2>
    <input type="text" id="quiz-set-title" placeholder="퀴즈 세트 제목">
    <div id="quiz-questions-input"></div>
    <div style="text-align: right;"><button class="btn-blue" onclick="addQuestionInput()">+ 문제 추가</button><button class="btn-green" onclick="saveQuizSet()">저장</button><button class="btn-dark" onclick="showView('view-entry')">뒤로</button></div>
    <hr><div id="saved-quiz-list" style="text-align:left;"></div>
</div>

<div id="view-lobby" class="view">
    <h2 id="display-room-title">🏫 <span id="display-room"></span>번 강의실</h2>
    <p id="lobby-msg">선생님이 퀴즈를 오픈할 때까지 기다려주세요.</p>
    <div id="student-start-area" style="display:none; margin: 30px 0;"><button class="btn-blue" style="width:100%; font-size:1.3rem;" onclick="startStudentQuiz()">🚀 퀴즈 시작하기</button></div>
    <div id="user-list"></div><button class="btn-red" onclick="leaveRoom()">나가기</button>
</div>

<div id="view-class" class="view">
    <div style="text-align:left; font-weight:bold; color:#64748b;">문제 <span id="current-q-num">1</span> / <span id="total-q-num"></span></div>
    <div id="problem-area"></div>
    <div class="choice-grid">
        <div id="wrong-x-overlay">❌</div>
        <button class="choice-btn c0" id="btn-c0" onclick="submitChoice(0)"></button>
        <button class="choice-btn c1" id="btn-c1" onclick="submitChoice(1)"></button>
        <button class="choice-btn c2" id="btn-c2" onclick="submitChoice(2)"></button>
        <button class="choice-btn c3" id="btn-c3" onclick="submitChoice(3)"></button>
    </div>
    <div class="timer-container"><span class="bomb-icon" id="bomb-ui">💣</span><div class="rope-track"><div class="rope-burn" id="rope-ui"></div></div><span class="timer-text" id="timer-sec-ui">0s</span></div>
</div>

<div id="view-progress" class="view">
    <h2 style="text-align:left;">📊 실시간 진행 현황</h2>
    <div class="progress-board" id="progress-board"></div>
    <div id="teacher-result-area" style="display:none; margin-top:20px;"><button class="btn-blue" style="width:100%;" onclick="triggerResults()">🏆 결과 발표하기</button></div>
</div>

<div id="view-ended" class="view"><h2>🏁 퀴즈 종료</h2><p>선생님이 결과를 발표할 때까지 대기해 주세요.</p></div>

<div id="view-results" class="view">
    <h2>🏆 최종 순위 발표</h2>
    <div class="podium-container" id="podium-area"></div>
    <div class="table-container"><table><thead><tr><th>순위</th><th>이름</th><th>정답</th><th>정답률</th></tr></thead><tbody id="result-tbody"></tbody></table></div>
    <button class="btn-dark" onclick="leaveRoom()" style="width:100%; margin-top:20px;">종료하고 나가기</button>
</div>

<div id="teacher-controls" style="display:none; position:fixed; bottom:0; left:0; right:0; background:white; border-top:1px solid var(--border); padding:15px 25px; z-index:1000; justify-content:space-between; align-items:center;">
    <strong>👨‍🏫 교사 제어 패널</strong><div><button class="btn-blue" id="btn-open-quiz" onclick="openQuiz()">퀴즈 오픈</button><button class="btn-red" onclick="resetRoom()">방 초기화</button></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, remove, onDisconnect, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    /* ==========================================================
       [주의] 아래 영역에 본인의 Firebase 설정값을 입력하십시오.
       ========================================================== */
     // 1. 본인의 Firebase 설정값을 여기에 꼭 넣으세요!
    const firebaseConfig = {
  apiKey: "AIzaSyD1YUdjxb-a9nMog4OVOkg8W9UyvrQ6NSk",
  authDomain: "ai-math-quiz2026.firebaseapp.com",
  databaseURL: "https://ai-math-quiz2026-default-rtdb.firebaseio.com/",
  projectId: "ai-math-quiz2026",
  storageBucket: "ai-math-quiz2026.firebasestorage.app",
  messagingSenderId: "184710615493",
  appId: "1:184710615493:web:7a86fa99270f51ccc37bac"
};
    /* ========================================================== */

    const app = initializeApp(firebaseConfig); const db = getDatabase(app);
    const userColors = ['#ef4444', '#f97316', '#f59e0b', '#84cc16', '#10b981', '#06b6d4', '#3b82f6', '#8b5cf6', '#d946ef', '#f43f5e'];
    let isTeacher = false, selectedRole = null, currentRoom = "", myName = "선생님", myKey = "", questionCount = 0, quizDataCache = null, myCurrentIdx = 0, timerInterval = null;

    window.showView = (id) => { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); document.getElementById(id).classList.add('active'); };

    window.selectRole = (role) => {
        selectedRole = role; document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
        document.getElementById(`card-${role}`).classList.add('selected');
        document.getElementById('action-area').classList.replace('enabled-section', 'disabled-section');
        document.getElementById('password-area').style.display = 'none';
    };

    window.applyRole = () => {
        if(!selectedRole) return alert("역할을 먼저 선택하세요.");
        if(selectedRole === 'teacher') document.getElementById('password-area').style.display = 'block';
        else enableRole('student');
    };

    window.verifyPwd = () => {
        if(document.getElementById('teacher-pwd').value === 'abcd') {
            document.getElementById('password-area').style.display = 'none'; enableRole('teacher');
        } else alert("비밀번호가 틀렸습니다.");
    };

    function enableRole(role) {
        isTeacher = (role === 'teacher');
        const area = document.getElementById('action-area');
        area.classList.replace('disabled-section', 'enabled-section');
        if(isTeacher) {
            document.getElementById('student-inputs-area').style.display = 'none';
            document.getElementById('teacher-entry-options').style.display = 'block';
            document.getElementById('teacher-set-selection').style.display = 'block';
            document.getElementById('btn-join').innerText = "방 생성하기";
            document.getElementById('teacher-controls').style.display = 'flex';
            document.body.style.paddingBottom = "80px"; loadQuizSets();
        } else {
            document.getElementById('student-inputs-area').style.display = 'block';
            document.getElementById('teacher-entry-options').style.display = 'none';
            document.getElementById('teacher-set-selection').style.display = 'none';
            document.getElementById('btn-join').innerText = "참여하기";
            document.getElementById('teacher-controls').style.display = 'none';
        }
    }

    window.addQuestionInput = () => {
        const id = questionCount++; const div = document.createElement('div'); div.className = 'quiz-item';
        div.innerHTML = `<strong>문제 ${id + 1}</strong><textarea class="q-text" rows="2"></textarea><input type="number" class="q-time" placeholder="제한시간(초)" value="30">
            <div class="opt-container">${[0,1,2,3].map(i => `<div class="opt-row"><input type="radio" name="correct_${id}" value="${i}" ${i===0?'checked':''}> <input type="text" class="q-opt" placeholder="보기 ${i+1}"></div>`).join('')}</div>`;
        document.getElementById('quiz-questions-input').appendChild(div);
    };

    window.saveQuizSet = () => {
        const title = document.getElementById('quiz-set-title').value;
        const questions = Array.from(document.querySelectorAll('.quiz-item')).map((item, idx) => ({
            text: item.querySelector('.q-text').value, options: Array.from(item.querySelectorAll('.q-opt')).map(o => o.value),
            answer: parseInt(item.querySelector(`input[name="correct_${idx}"]:checked`).value), timeLimit: parseInt(item.querySelector('.q-time').value) || 30
        })).filter(q => q.text && q.options[0]);
        if(!title || !questions.length) return alert("입력 확인!");
        push(ref(db, `quizSets`), { title, questions }).then(() => { alert("저장 완료"); loadQuizSets(); });
    };

    window.loadQuizSets = () => {
        onValue(ref(db, `quizSets`), (snap) => {
            const sel = document.getElementById('select-quiz-set'), lst = document.getElementById('saved-quiz-list');
            sel.innerHTML = ""; lst.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([id, s]) => {
                sel.innerHTML += `<option value="${id}">${s.title}</option>`;
                lst.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>${s.title}</span> <button onclick="deleteQuizSet('${id}')" style="background:var(--red); color:white; padding:4px 8px; font-size:0.8rem;">삭제</button></div>`;
            });
        });
    };
    window.deleteQuizSet = (id) => remove(ref(db, `quizSets/${id}`));

    window.handleEntry = () => {
        currentRoom = document.getElementById('input-room').value; if(!currentRoom) return alert("방 번호!");
        if(isTeacher) {
            const setId = document.getElementById('select-quiz-set').value; if(!setId) return alert("세트 선택!");
            onValue(ref(db, `quizSets/${setId}`), (snap) => {
                quizDataCache = snap.val(); set(ref(db, `rooms/${currentRoom}`), { status: 'lobby', quizData: quizDataCache });
                showView('view-lobby'); document.getElementById('display-room').innerText = currentRoom; startTeacherSync();
            }, { onlyOnce: true });
        } else {
            myName = document.getElementById('input-name').value; if(!myName) return alert("닉네임!");
            const uRef = push(ref(db, `rooms/${currentRoom}/users`)); myKey = uRef.key;
            onDisconnect(ref(db, `rooms/${currentRoom}/users/${myKey}`)).remove();
            set(uRef, { name: myName, currentIdx: -1, correct: 0 }); 
            showView('view-lobby'); document.getElementById('display-room').innerText = currentRoom; startStudentSync();
        }
    };

    window.openQuiz = () => { update(ref(db, `rooms/${currentRoom}`), { status: 'opened' }); document.getElementById('btn-open-quiz').style.display = 'none'; showView('view-progress'); };
    window.triggerResults = () => update(ref(db, `rooms/${currentRoom}`), { status: 'results' });

    function startTeacherSync() {
        onValue(ref(db, `rooms/${currentRoom}/users`), snap => {
            if(!quizDataCache) return; const users = snap.val() || {}; const totalQ = quizDataCache.questions.length;
            const lobbyList = document.getElementById('user-list'); lobbyList.innerHTML = "";
            const board = document.getElementById('progress-board'); board.innerHTML = "";
            let cols = ""; for(let i=0; i<=totalQ; i++) cols += `<div class="prob-col" id="col-${i}"><h4>${i===totalQ?"완료":i+1+"번"}</h4></div>`;
            board.innerHTML = cols;
            let finished = true, count = 0;
            Object.entries(users).forEach(([k, u]) => {
                count++; const color = userColors[k.charCodeAt(k.length-1)%userColors.length];
                const circle = `<div class="user-circle" style="background:${color}; width:35px; height:35px; font-size:0.7rem;">${u.name}</div>`;
                lobbyList.innerHTML += `<div class="user-circle" style="background:${color};">${u.name}</div>`;
                let tIdx = u.currentIdx === -1 ? 0 : u.currentIdx; if(tIdx>totalQ) tIdx=totalQ;
                const colDiv = document.getElementById(`col-${tIdx}`); if(colDiv) colDiv.innerHTML += circle;
                if(u.currentIdx < totalQ) finished = false;
            });
            document.getElementById('teacher-result-area').style.display = (count > 0 && finished) ? 'block' : 'none';
        });
    }

    function startStudentSync() {
        onValue(ref(db, `rooms/${currentRoom}/status`), snap => {
            const s = snap.val(); if(!s) return;
            if(s === 'opened') { document.getElementById('lobby-msg').innerText = "오픈됨!"; document.getElementById('student-start-area').style.display = 'block'; }
            else if(s === 'results') { showView('view-results'); renderResults(); }
        });
        onValue(ref(db, `rooms/${currentRoom}/quizData`), snap => { quizDataCache = snap.val(); if(quizDataCache) document.getElementById('total-q-num').innerText = quizDataCache.questions.length; });
    }

    window.startStudentQuiz = () => { myCurrentIdx = 0; update(ref(db, `rooms/${currentRoom}/users/${myKey}`), { currentIdx: 0 }); showView('view-class'); loadProblem(); };

    function loadProblem() {
        const totalQ = quizDataCache.questions.length;
        if (myCurrentIdx >= totalQ) { update(ref(db, `rooms/${currentRoom}/users/${myKey}`), { currentIdx: totalQ }); showView('view-ended'); return; }
        update(ref(db, `rooms/${currentRoom}/users/${myKey}`), { currentIdx: myCurrentIdx });
        document.getElementById('current-q-num').innerText = myCurrentIdx + 1;
        const q = quizDataCache.questions[myCurrentIdx]; document.getElementById('problem-area').innerHTML = q.text;
        [0,1,2,3].forEach(i => { const b = document.getElementById(`btn-c${i}`); b.innerText = q.options[i]||"-"; b.disabled=false; });
        MathJax.typesetPromise(); startVisualTimer(q.timeLimit);
    }

    function startVisualTimer(dur) {
        clearInterval(timerInterval); document.getElementById('bomb-ui').classList.remove('shake-small'); document.getElementById('wrong-x-overlay').style.display = 'none';
        const rope = document.getElementById('rope-ui'), text = document.getElementById('timer-sec-ui');
        rope.style.transition = 'none'; rope.style.width = '100%'; setTimeout(() => { rope.style.transition = `width ${dur}s linear`; rope.style.width = '0%'; }, 50);
        let left = dur; text.innerText = `${left}s`;
        timerInterval = setInterval(() => { left--; text.innerText = `${left}s`; if(left <= 0) { clearInterval(timerInterval); explodeAndNext(); } }, 1000);
    }

    window.submitChoice = (idx) => {
        [0,1,2,3].forEach(i => document.getElementById(`btn-c${i}`).disabled = true); clearInterval(timerInterval);
        if(quizDataCache.questions[myCurrentIdx].answer === idx) {
            onValue(ref(db, `rooms/${currentRoom}/users/${myKey}/correct`), snap => { update(ref(db, `rooms/${currentRoom}/users/${myKey}`), { correct: (snap.val() || 0) + 1 }); myCurrentIdx++; loadProblem(); }, {onlyOnce:true});
        } else { myCurrentIdx++; loadProblem(); }
    };

    function explodeAndNext() {
        document.getElementById('bomb-ui').classList.add('shake-small'); document.getElementById('wrong-x-overlay').style.display = 'flex';
        setTimeout(() => { myCurrentIdx++; loadProblem(); }, 500);
    }

    function renderResults() {
        onValue(ref(db, `rooms/${currentRoom}`), (snap) => {
            const data = snap.val(); if(!data || !data.users) return; const total = data.quizData.questions.length;
            let sMap = {}; Object.values(data.users).forEach(u => { const s = u.correct||0; if(!sMap[s]) sMap[s]=[]; sMap[s].push(u); });
            let uScores = Object.keys(sMap).map(Number).sort((a,b)=>b-a);
            const cStep = (u, cls, ic) => { const a = total>0?Math.round((u.correct||0)/total*100):0; return `<div class="step ${cls}"><div style="font-size:1.3rem;">${ic}</div><div class="step-name">${u.name}</div><div class="step-score">${u.correct||0}/${total}<br>(${a}%)</div></div>`; };
            let pHTML = ""; 
            (sMap[uScores[0]]||[]).forEach(u=>pHTML+=cStep(u,'first','🥇'));
            (sMap[uScores[1]]||[]).forEach(u=>pHTML+=cStep(u,'second','🥈'));
            (sMap[uScores[2]]||[]).forEach(u=>pHTML+=cStep(u,'third','🥉'));
            document.getElementById('podium-area').innerHTML = pHTML;
            const tb = document.getElementById('result-tbody'); tb.innerHTML = "";
            uScores.forEach((s, idx) => { if(idx>2) sMap[s].forEach(u => tb.innerHTML += `<tr><td>${idx+1}위</td><td>${u.name}</td><td>${u.correct}</td><td>${total>0?Math.round(u.correct/total*100):0}%</td></tr>`); });
        }, {onlyOnce: true});
    }

    window.resetRoom = () => confirm("초기화?") && remove(ref(db, `rooms/${currentRoom}`)).then(()=>location.reload());
    window.leaveRoom = () => confirm("종료하고 나갈까요?") && location.reload();
</script>
</body>
</html>
