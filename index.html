<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 수학 객관식 퀴즈 시스템</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root { --primary: #007bff; --teacher: #2d3436; --bg: #f4f7f9; --red: #e21b3c; --blue: #1368ce; --yellow: #d89e00; --green: #26890c; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; padding: 20px; text-align: center; }
        .view { display: none; max-width: 850px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .active { display: block; }
        
        #user-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin: 20px 0; }
        .user-circle { width: 100px; height: 100px; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; animation: bounce 2s infinite ease-in-out; overflow-wrap: break-word; padding: 10px; text-align: center; line-height: 1.2; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        input, select, textarea { padding: 12px; width: 95%; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 1rem; box-sizing: border-box; }
        button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; font-size: 1rem; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-dark { background: var(--teacher); color: white; }
        .btn-red { background: #ff4757; color: white; }
        .btn-green { background: #2ecc71; color: white; }

        .quiz-item { border: 1px solid #eee; padding: 20px; margin-bottom: 20px; border-radius: 15px; text-align: left; background: #fafafa; }
        .opt-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .opt-row input[type="radio"] { width: 20px; height: 20px; margin: 0; }
        .opt-row input[type="text"] { margin: 0; flex: 1; }
        .time-input { width: 30% !important; margin-top: 10px !important; }

        #problem-area { font-size: 2rem; margin: 20px 0; padding: 30px; background: #f8f9fa; border-radius: 15px; border-left: 10px solid var(--primary); min-height: 100px; }
        #timer-display { font-size: 2.5rem; color: var(--red); font-weight: bold; margin-bottom: 10px; }
        
        .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .choice-btn { height: 100px; font-size: 1.2rem; color: white; border-radius: 12px; transition: 0.2s; }
        .c0 { background: var(--red); } .c1 { background: var(--blue); } .c2 { background: var(--yellow); } .c3 { background: var(--green); }

        /* 결과 시상대 및 표 스타일 */
        .podium-container { display: flex; align-items: flex-end; justify-content: center; height: 250px; gap: 10px; margin-bottom: 30px; border-bottom: 3px solid #ddd; padding-bottom: 10px; }
        .step { width: 120px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; color: white; border-top-left-radius: 15px; border-top-right-radius: 15px; font-weight: bold; padding-bottom: 15px; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); }
        .step.first { height: 200px; background: linear-gradient(to top, #FFD700, #FEE140); }
        .step.second { height: 150px; background: linear-gradient(to top, #C0C0C0, #E2E2E2); }
        .step.third { height: 110px; background: linear-gradient(to top, #CD7F32, #E6A15C); }
        .step-name { font-size: 1.1rem; margin-top: 5px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .step-score { font-size: 0.9rem; font-weight: normal; }
        
        .table-container { height: 250px; overflow-y: auto; border: 1px solid #ddd; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; }
        th { background: #f4f7f9; position: sticky; top: 0; }
    </style>
</head>
<body>

<div id="view-entry" class="view active">
    <h1>🎓 AI 수학 객관식 퀴즈</h1>
    <div id="teacher-entry-options" style="display:none; margin-bottom: 20px;">
        <button class="btn-green" onclick="showView('view-quiz-manager')">퀴즈 세트 제작/관리</button>
    </div>
    <div id="entry-form">
        <input type="text" id="input-room" placeholder="방 번호 입력">
        <div id="student-inputs-area">
            <input type="text" id="input-name" placeholder="닉네임 입력 (최대 10자)" maxlength="10">
        </div>
        <div id="teacher-set-selection" style="display:none;">
            <p>사용할 퀴즈 세트 선택:</p>
            <select id="select-quiz-set"><option value="">퀴즈를 먼저 제작하세요</option></select>
        </div>
        <br>
        <button id="btn-join" class="btn-blue" onclick="handleEntry()">수업 참여하기</button>
    </div>
</div>

<div id="view-quiz-manager" class="view">
    <h2>📝 객관식 퀴즈 제작 (제한시간 포함)</h2>
    <input type="text" id="quiz-set-title" placeholder="퀴즈 세트 제목">
    <div id="quiz-questions-input"></div>
    <button class="btn-blue" onclick="addQuestionInput()">+ 문제 추가</button>
    <button class="btn-green" onclick="saveQuizSet()">퀴즈 세트 저장</button>
    <button class="btn-dark" onclick="showView('view-entry')">뒤로 가기</button>
    <hr>
    <h3>저장된 퀴즈 목록</h3>
    <div id="saved-quiz-list"></div>
</div>

<div id="view-lobby" class="view">
    <h2>🏫 <span id="display-room"></span>번 강의실 (대기중)</h2>
    <div id="user-list"></div>
    <button class="btn-red" onclick="leaveRoom()">방 나가기</button>
</div>

<div id="view-class" class="view">
    <div id="timer-display">⏱ 00</div>
    <div id="problem-area">문제를 기다리는 중...</div>
    <div id="choice-area" class="choice-grid">
        <button class="choice-btn c0" id="btn-c0" onclick="submitChoice(0)">1번</button>
        <button class="choice-btn c1" id="btn-c1" onclick="submitChoice(1)">2번</button>
        <button class="choice-btn c2" id="btn-c2" onclick="submitChoice(2)">3번</button>
        <button class="choice-btn c3" id="btn-c3" onclick="submitChoice(3)">4번</button>
    </div>
</div>

<div id="view-ended" class="view">
    <h2 style="font-size:2.5rem; margin-top:50px;">🏁 퀴즈가 모두 종료되었습니다!</h2>
    <p>선생님이 결과를 집계하고 있습니다. 잠시만 기다려주세요.</p>
    <div id="teacher-result-btn" style="display:none; margin-top:40px;">
        <button class="btn-blue" style="font-size:1.5rem; padding:15px 30px;" onclick="showResultsToAll()">🏆 전체 결과 보기 🏆</button>
    </div>
</div>

<div id="view-results" class="view">
    <h2>🏆 최종 순위 발표 🏆</h2>
    <div class="podium-container" id="podium-area"></div>
    <div class="table-container">
        <table>
            <thead><tr><th>순위</th><th>이름</th><th>정답 수</th><th>정답률</th></tr></thead>
            <tbody id="result-tbody"></tbody>
        </table>
    </div>
    <button class="btn-red" onclick="leaveRoom()" style="margin-top:20px;">수업 종료하고 나가기</button>
</div>

<div id="teacher-controls" style="display:none; position:fixed; bottom:0; left:0; right:0; background:#2d3436; padding:15px; color:white; z-index:1000;">
    <strong>👨‍🏫 교사 제어:</strong>
    <button class="btn-dark" onclick="updateStatus('lobby')">대기실</button>
    <span id="quiz-navigation"></span>
    <button class="btn-red" onclick="endQuizProcess()">퀴즈 종료</button>
    <button class="btn-dark" onclick="resetRoom()" style="float:right;">방 전체 초기화</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

   // 1. 본인의 Firebase 설정값을 여기에 꼭 넣으세요!
    const firebaseConfig = {
  apiKey: "AIzaSyD1YUdjxb-a9nMog4OVOkg8W9UyvrQ6NSk",
  authDomain: "ai-math-quiz2026.firebaseapp.com",
  databaseURL: "https://ai-math-quiz2026-default-rtdb.firebaseio.com/",
  projectId: "ai-math-quiz2026",
  storageBucket: "ai-math-quiz2026.firebasestorage.app",
  messagingSenderId: "184710615493",
  appId: "1:184710615493:web:7a86fa99270f51ccc37bac"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const isTeacher = new URLSearchParams(window.location.search).get('role') === 'teacher';
    let currentRoom = "", myName = "선생님", myKey = "", questionCount = 0;
    let timerInterval = null;
    let currentProbIdx = -1;
    let totalQuestionsCount = 0;

    window.showView = (id) => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };

    window.addQuestionInput = () => {
        const id = questionCount++;
        const div = document.createElement('div');
        div.className = 'quiz-item';
        div.innerHTML = `
            <strong>문제 ${id + 1} (LaTeX 가능):</strong>
            <textarea class="q-text" rows="2"></textarea>
            <input type="number" class="q-time time-input" placeholder="제한시간 (예: 30초)" value="30">
            <p style="margin-top:10px;">보기 입력 및 정답 선택:</p>
            <div class="opt-container">
                ${[0,1,2,3].map(i => `
                    <div class="opt-row">
                        <input type="radio" name="correct_${id}" value="${i}" ${i===0?'checked':''}>
                        <input type="text" class="q-opt" placeholder="보기 ${i+1}">
                    </div>
                `).join('')}
            </div>
        `;
        document.getElementById('quiz-questions-input').appendChild(div);
    };

    window.saveQuizSet = () => {
        const title = document.getElementById('quiz-set-title').value;
        const items = document.querySelectorAll('.quiz-item');
        const questions = Array.from(items).map((item, idx) => {
            const opts = Array.from(item.querySelectorAll('.q-opt')).map(o => o.value);
            const correctIdx = item.querySelector(`input[name="correct_${idx}"]:checked`).value;
            const timeLimit = parseInt(item.querySelector('.q-time').value) || 30;
            return { text: item.querySelector('.q-text').value, options: opts, answer: parseInt(correctIdx), timeLimit: timeLimit };
        }).filter(q => q.text && q.options[0]);

        if(!title || questions.length === 0) return alert("제목과 문제를 입력하세요.");
        push(ref(db, `quizSets`), { title, questions }).then(() => { alert("저장 완료!"); loadQuizSets(); });
    };

    window.loadQuizSets = function() {
        onValue(ref(db, `quizSets`), (snap) => {
            const select = document.getElementById('select-quiz-set');
            const list = document.getElementById('saved-quiz-list');
            select.innerHTML = ""; list.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([id, s]) => {
                select.innerHTML += `<option value="${id}">${s.title}</option>`;
                list.innerHTML += `<div style="margin-bottom:8px;">• ${s.title} <button onclick="deleteQuizSet('${id}')" style="padding:2px 5px; background:#ff4757; color:white; border-radius:4px;">삭제</button></div>`;
            });
        });
    };
    
    window.deleteQuizSet = (id) => remove(ref(db, `quizSets/${id}`));

    window.handleEntry = function() {
        currentRoom = document.getElementById('input-room').value;
        if(!currentRoom) return alert("방 번호 입력!");
        if(isTeacher) {
            const setId = document.getElementById('select-quiz-set').value;
            if(!setId) return alert("세트 선택!");
            onValue(ref(db, `quizSets/${setId}`), (snap) => {
                const qData = snap.val();
                totalQuestionsCount = qData.questions.length;
                set(ref(db, `rooms/${currentRoom}`), { status: 'lobby', quizData: qData });
                setupQuizNav(qData.questions);
            }, { onlyOnce: true });
            showView('view-lobby'); startSync();
        } else {
            myName = document.getElementById('input-name').value;
            if(!myName) return alert("이름 입력!");
            const uRef = push(ref(db, `rooms/${currentRoom}/users`));
            myKey = uRef.key;
            onDisconnect(ref(db, `rooms/${currentRoom}/users/${myKey}`)).remove();
            set(uRef, { name: myName, correctCount: 0 }); 
            showView('view-lobby'); startSync();
        }
    };

    window.setupQuizNav = function(qs) {
        const nav = document.getElementById('quiz-navigation'); nav.innerHTML = "";
        qs.forEach((q, i) => {
            const b = document.createElement('button'); b.innerText = `${i+1}번`; b.className = "btn-blue";
            b.onclick = () => {
                set(ref(db, `rooms/${currentRoom}/status`), 'class');
                set(ref(db, `rooms/${currentRoom}/problem`), { text: q.text, options: q.options, timeLimit: q.timeLimit, idx: i, timestamp: Date.now() });
            };
            nav.appendChild(b);
        });
    };

    window.startSync = function() {
        onValue(ref(db, `rooms/${currentRoom}/status`), (snap) => {
            const s = snap.val();
            if(!s && !isTeacher) { alert("방이 존재하지 않습니다."); location.reload(); return; }
            
            if(s === 'lobby') showView('view-lobby');
            else if(s === 'class') showView('view-class');
            else if(s === 'ended') {
                showView('view-ended');
                if(isTeacher) document.getElementById('teacher-result-btn').style.display = 'block';
            }
            else if(s === 'results') {
                showView('view-results');
                renderResults(); 
            }
        });

        const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#FDCB6E', '#6C5CE7', '#2ecc71'];
        onValue(ref(db, `rooms/${currentRoom}/users`), (snap) => {
            const list = document.getElementById('user-list'); list.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([k, u]) => {
                const d = document.createElement('div'); d.className = 'user-circle';
                d.style.backgroundColor = colors[k.charCodeAt(k.length-1) % colors.length];
                d.innerText = u.name; list.appendChild(d);
            });
        });

        onValue(ref(db, `rooms/${currentRoom}/problem`), (snap) => {
            const p = snap.val();
            if(p) {
                currentProbIdx = p.idx;
                document.getElementById('problem-area').innerHTML = p.text;
                
                [0,1,2,3].forEach(i => {
                    const btn = document.getElementById(`btn-c${i}`);
                    btn.innerText = p.options[i] || "보기 없음";
                    btn.disabled = false; 
                });
                MathJax.typesetPromise();

                clearInterval(timerInterval);
                let timeLeft = p.timeLimit;
                const timerDisplay = document.getElementById('timer-display');
                timerDisplay.innerText = `⏱ ${timeLeft}초`;
                timerDisplay.style.color = "var(--red)";
                
                timerInterval = setInterval(() => {
                    timeLeft--;
                    timerDisplay.innerText = `⏱ ${timeLeft}초`;
                    if(timeLeft <= 0) {
                        clearInterval(timerInterval);
                        timerDisplay.innerText = "⏱ 시간 초과!";
                        [0,1,2,3].forEach(i => document.getElementById(`btn-c${i}`).disabled = true); 
                    }
                }, 1000);
            }
        });
    };

    window.updateStatus = (s) => set(ref(db, `rooms/${currentRoom}/status`), s);
    window.leaveRoom = () => { if(confirm("퇴장하시겠습니까?")) { if(myKey) remove(ref(db, `rooms/${currentRoom}/users/${myKey}`)); location.reload(); }};
    window.resetRoom = () => { if(confirm("초기화?")) remove(ref(db, `rooms/${currentRoom}`)).then(() => location.reload()); };
    
    window.submitChoice = (idx) => {
        if(currentProbIdx === -1) return;
        [0,1,2,3].forEach(i => document.getElementById(`btn-c${i}`).disabled = true); 
        
        onValue(ref(db, `rooms/${currentRoom}/quizData/questions/${currentProbIdx}`), (snap) => {
            const questionData = snap.val();
            const isCorrect = (questionData.answer === idx);
            
            push(ref(db, `rooms/${currentRoom}/results`), { name: myName, probIdx: currentProbIdx, choice: idx, isCorrect: isCorrect, time: Date.now() });
            alert(isCorrect ? "선택 완료!" : "선택 완료!");
        }, { onlyOnce: true });
    };

    window.endQuizProcess = () => {
        if(confirm("문제를 모두 풀었습니까? 퀴즈를 종료하고 대기 화면으로 이동합니다.")) {
            updateStatus('ended');
        }
    };

    window.showResultsToAll = () => {
        updateStatus('results'); 
    };

    window.renderResults = function() {
        onValue(ref(db, `rooms/${currentRoom}`), (snap) => {
            const roomData = snap.val();
            if(!roomData || !roomData.users) return;

            const totalQs = roomData.quizData.questions.length;
            let userScores = {};

            Object.values(roomData.users).forEach(u => {
                userScores[u.name] = { name: u.name, correct: 0 };
            });

            if(roomData.results) {
                Object.values(roomData.results).forEach(r => {
                    if(r.isCorrect && userScores[r.name]) {
                        userScores[r.name].correct += 1;
                    }
                });
            }

            let sortedUsers = Object.values(userScores).sort((a, b) => b.correct - a.correct);

            const podiumArea = document.getElementById('podium-area');
            podiumArea.innerHTML = "";
            
            const first = sortedUsers[0] || { name: "-", correct: 0 };
            const second = sortedUsers[1] || { name: "-", correct: 0 };
            const third = sortedUsers[2] || { name: "-", correct: 0 };

            podiumArea.innerHTML = `
                <div class="step second">
                    <div style="font-size:2rem;">🥈</div>
                    <div class="step-name">${second.name}</div>
                    <div class="step-score">${second.correct} / ${totalQs}</div>
                </div>
                <div class="step first">
                    <div style="font-size:3rem; margin-bottom:10px;">🥇</div>
                    <div class="step-name">${first.name}</div>
                    <div class="step-score">${first.correct} / ${totalQs}</div>
                </div>
                <div class="step third">
                    <div style="font-size:1.5rem;">🥉</div>
                    <div class="step-name">${third.name}</div>
                    <div class="step-score">${third.correct} / ${totalQs}</div>
                </div>
            `;

            const tbody = document.getElementById('result-tbody');
            tbody.innerHTML = "";
            sortedUsers.forEach((u, index) => {
                const rank = index + 1;
                const accuracy = totalQs > 0 ? Math.round((u.correct / totalQs) * 100) : 0;
                tbody.innerHTML += `
                    <tr>
                        <td>${rank}위</td>
                        <td>${u.name}</td>
                        <td>${u.correct}문제</td>
                        <td>${accuracy}%</td>
                    </tr>
                `;
            });
        }, { onlyOnce: true });
    };

    if (isTeacher) {
        document.getElementById('teacher-entry-options').style.display = 'block';
        document.getElementById('student-inputs-area').style.display = 'none';
        document.getElementById('teacher-set-selection').style.display = 'block';
        document.getElementById('btn-join').innerText = "방 생성하기";
        document.getElementById('teacher-controls').style.display = 'block';
        window.loadQuizSets();
        window.addQuestionInput(); 
    }
</script>
</body>
</html>
