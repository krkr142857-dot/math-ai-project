<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 수학 객관식 퀴즈 시스템</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root { --primary: #007bff; --teacher: #2d3436; --bg: #f4f7f9; --red: #e21b3c; --blue: #1368ce; --yellow: #d89e00; --green: #26890c; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; padding: 20px; text-align: center; overflow-x: hidden; }
        .view { display: none; max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .active { display: block; }
        
        #user-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin: 20px 0; }
        .user-circle { width: 80px; height: 80px; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; overflow-wrap: break-word; padding: 5px; text-align: center; line-height: 1.2; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        input, select, textarea { padding: 12px; width: 95%; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 1rem; box-sizing: border-box; }
        button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; font-size: 1rem; transition: 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-dark { background: var(--teacher); color: white; }
        .btn-red { background: #ff4757; color: white; }
        .btn-green { background: #2ecc71; color: white; }

        .quiz-item { border: 1px solid #eee; padding: 20px; margin-bottom: 20px; border-radius: 15px; text-align: left; background: #fafafa; }
        .opt-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .opt-row input[type="radio"] { width: 20px; height: 20px; margin: 0; }
        .opt-row input[type="text"] { margin: 0; flex: 1; }
        .time-input { width: 30% !important; margin-top: 10px !important; }

        #problem-area { font-size: 1.8rem; margin: 20px 0; padding: 30px; background: #f8f9fa; border-radius: 15px; border-left: 10px solid var(--primary); min-height: 100px; }
        
        .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .choice-btn { height: 100px; font-size: 1.2rem; color: white; border-radius: 12px; transition: 0.2s; }
        .c0 { background: var(--red); } .c1 { background: var(--blue); } .c2 { background: var(--yellow); } .c3 { background: var(--green); }

        /* 폭탄 및 밧줄 타이머 UI */
        .timer-container { display: flex; align-items: center; margin-top: 30px; padding: 10px; background: #eee; border-radius: 10px; }
        .bomb-icon { font-size: 2rem; margin-right: 10px; }
        .rope-track { flex: 1; height: 10px; background: #ccc; border-radius: 5px; overflow: hidden; position: relative; }
        .rope-burn { height: 100%; background: #ff9800; width: 100%; transform-origin: left; }
        .timer-text { font-size: 1.2rem; font-weight: bold; margin-left: 10px; width: 50px; }

        /* 폭발 이펙트 전체 화면 */
        #explosion-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #fff, #ff9800, #ff0000, #000); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; color: white; }
        #explosion-overlay h1 { font-size: 6rem; text-shadow: 0 0 20px #fff; animation: shake 0.5s infinite; }
        @keyframes shake { 0% { transform: translate(2px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(0px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(2px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(2px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }

        /* 교사용 진행 현황 보드 */
        .progress-board { display: flex; gap: 15px; overflow-x: auto; padding: 20px 0; min-height: 200px; align-items: flex-start; }
        .prob-col { flex: 0 0 120px; background: #f4f7f9; border-radius: 10px; padding: 10px; border: 1px solid #ddd; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .prob-col h4 { margin: 0 0 10px 0; font-size: 1rem; color: #333; }

        /* 시상대 및 결과 표 */
        .podium-container { display: flex; align-items: flex-end; justify-content: center; height: 250px; gap: 10px; margin-bottom: 30px; border-bottom: 3px solid #ddd; padding-bottom: 10px; }
        .step { width: 120px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; color: white; border-top-left-radius: 15px; border-top-right-radius: 15px; font-weight: bold; padding-bottom: 15px; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); }
        .step.first { height: 200px; background: linear-gradient(to top, #FFD700, #FEE140); }
        .step.second { height: 150px; background: linear-gradient(to top, #C0C0C0, #E2E2E2); }
        .step.third { height: 110px; background: linear-gradient(to top, #CD7F32, #E6A15C); }
        .table-container { height: 250px; overflow-y: auto; border: 1px solid #ddd; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; }
        th { background: #f4f7f9; position: sticky; top: 0; }
    </style>
</head>
<body>

<div id="explosion-overlay">
    <h1>💥 시간 초과 💥</h1>
</div>

<div id="view-entry" class="view active">
    <h1>🎓 AI 수학 객관식 퀴즈</h1>
    <div id="teacher-entry-options" style="display:none; margin-bottom: 20px;">
        <button class="btn-green" onclick="showView('view-quiz-manager')">퀴즈 세트 제작/관리</button>
    </div>
    <div id="entry-form">
        <input type="text" id="input-room" placeholder="방 번호 입력">
        <div id="student-inputs-area">
            <input type="text" id="input-name" placeholder="닉네임 입력 (최대 10자)" maxlength="10">
        </div>
        <div id="teacher-set-selection" style="display:none;">
            <p>사용할 퀴즈 세트 선택:</p>
            <select id="select-quiz-set"><option value="">퀴즈를 먼저 제작하세요</option></select>
        </div>
        <br><button id="btn-join" class="btn-blue" onclick="handleEntry()">수업 참여하기</button>
    </div>
</div>

<div id="view-quiz-manager" class="view">
    <h2>📝 객관식 퀴즈 제작</h2>
    <input type="text" id="quiz-set-title" placeholder="퀴즈 세트 제목">
    <div id="quiz-questions-input"></div>
    <button class="btn-blue" onclick="addQuestionInput()">+ 문제 추가</button>
    <button class="btn-green" onclick="saveQuizSet()">퀴즈 세트 저장</button>
    <button class="btn-dark" onclick="showView('view-entry')">뒤로 가기</button>
    <hr><h3>저장된 퀴즈 목록</h3><div id="saved-quiz-list"></div>
</div>

<div id="view-lobby" class="view">
    <h2>🏫 <span id="display-room"></span>번 강의실 (대기중)</h2>
    <p id="lobby-msg">선생님이 퀴즈를 오픈할 때까지 기다려주세요.</p>
    <div id="student-start-area" style="display:none; margin: 20px 0;">
        <button class="btn-blue" style="font-size:1.5rem; padding:15px 30px;" onclick="startStudentQuiz()">🚀 퀴즈 시작하기</button>
    </div>
    <div id="user-list"></div>
    <button class="btn-red" onclick="leaveRoom()">방 나가기</button>
</div>

<div id="view-class" class="view">
    <div style="font-weight:bold; font-size:1.2rem; color:#555;">문제 <span id="current-q-num">1</span> / <span id="total-q-num"></span></div>
    <div id="problem-area">문제를 불러오는 중...</div>
    <div id="choice-area" class="choice-grid">
        <button class="choice-btn c0" id="btn-c0" onclick="submitChoice(0)">1번</button>
        <button class="choice-btn c1" id="btn-c1" onclick="submitChoice(1)">2번</button>
        <button class="choice-btn c2" id="btn-c2" onclick="submitChoice(2)">3번</button>
        <button class="choice-btn c3" id="btn-c3" onclick="submitChoice(3)">4번</button>
    </div>
    <div class="timer-container">
        <span class="bomb-icon">💣</span>
        <div class="rope-track"><div class="rope-burn" id="rope-ui"></div></div>
        <span class="timer-text" id="timer-sec-ui">0s</span>
    </div>
</div>

<div id="view-progress" class="view">
    <h2>📊 실시간 학생 진행 현황</h2>
    <div class="progress-board" id="progress-board">
        </div>
    <div id="teacher-result-area" style="display:none; margin-top:20px;">
        <p style="color:var(--red); font-weight:bold;">모든 학생이 퀴즈를 완료했습니다.</p>
        <button class="btn-blue" style="font-size:1.5rem; padding:15px 30px;" onclick="triggerResults()">🏆 결과 발표하기</button>
    </div>
</div>

<div id="view-ended" class="view">
    <h2 style="font-size:2.5rem; margin-top:50px;">🏁 퀴즈가 종료되었습니다!</h2>
    <p>다른 친구들이 문제를 다 풀 때까지 기다려 주세요.</p>
</div>

<div id="view-results" class="view">
    <h2>🏆 최종 순위 발표 🏆</h2>
    <div class="podium-container" id="podium-area"></div>
    <div class="table-container">
        <table>
            <thead><tr><th>순위</th><th>이름</th><th>정답 수</th><th>정답률</th></tr></thead>
            <tbody id="result-tbody"></tbody>
        </table>
    </div>
    <button class="btn-red" onclick="leaveRoom()" style="margin-top:20px;">수업 종료하고 나가기</button>
</div>

<div id="teacher-controls" style="display:none; position:fixed; bottom:0; left:0; right:0; background:#2d3436; padding:15px; color:white; z-index:1000;">
    <strong>👨‍🏫 교사 제어:</strong>
    <button class="btn-blue" id="btn-open-quiz" onclick="openQuiz()">퀴즈 오픈</button>
    <button class="btn-dark" onclick="resetRoom()" style="float:right;">방 전체 초기화</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, remove, onDisconnect, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

   // 1. 본인의 Firebase 설정값을 여기에 꼭 넣으세요!
    const firebaseConfig = {
  apiKey: "AIzaSyD1YUdjxb-a9nMog4OVOkg8W9UyvrQ6NSk",
  authDomain: "ai-math-quiz2026.firebaseapp.com",
  databaseURL: "https://ai-math-quiz2026-default-rtdb.firebaseio.com/",
  projectId: "ai-math-quiz2026",
  storageBucket: "ai-math-quiz2026.firebasestorage.app",
  messagingSenderId: "184710615493",
  appId: "1:184710615493:web:7a86fa99270f51ccc37bac"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const isTeacher = new URLSearchParams(window.location.search).get('role') === 'teacher';
    const userColors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#FDCB6E', '#6C5CE7', '#2ecc71'];
    
    let currentRoom = "", myName = "선생님", myKey = "", questionCount = 0;
    let quizDataCache = null;
    let myCurrentIdx = 0;
    let timerInterval = null;
    let explosionTimeout = null;

    // --- 기본 유틸 ---
    window.showView = (id) => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };

    function getUserColor(key) {
        return userColors[key.charCodeAt(key.length - 1) % userColors.length];
    }

    // --- 퀴즈 제작 ---
    window.addQuestionInput = () => {
        const id = questionCount++;
        const div = document.createElement('div'); div.className = 'quiz-item';
        div.innerHTML = `<strong>문제 ${id + 1} (LaTeX 가능):</strong><textarea class="q-text" rows="2"></textarea>
            <input type="number" class="q-time time-input" placeholder="제한시간 (예: 30초)" value="30">
            <p style="margin-top:10px;">보기 입력 및 정답 선택:</p>
            <div class="opt-container">${[0,1,2,3].map(i => `<div class="opt-row"><input type="radio" name="correct_${id}" value="${i}" ${i===0?'checked':''}> <input type="text" class="q-opt" placeholder="보기 ${i+1}"></div>`).join('')}</div>`;
        document.getElementById('quiz-questions-input').appendChild(div);
    };

    window.saveQuizSet = () => {
        const title = document.getElementById('quiz-set-title').value;
        const questions = Array.from(document.querySelectorAll('.quiz-item')).map((item, idx) => {
            return {
                text: item.querySelector('.q-text').value,
                options: Array.from(item.querySelectorAll('.q-opt')).map(o => o.value),
                answer: parseInt(item.querySelector(`input[name="correct_${idx}"]:checked`).value),
                timeLimit: parseInt(item.querySelector('.q-time').value) || 30
            };
        }).filter(q => q.text && q.options[0]);
        if(!title || !questions.length) return alert("제목과 문제를 확인하십시오.");
        push(ref(db, `quizSets`), { title, questions }).then(() => { alert("저장 완료!"); loadQuizSets(); });
    };

    window.loadQuizSets = () => {
        onValue(ref(db, `quizSets`), (snap) => {
            const select = document.getElementById('select-quiz-set'); const list = document.getElementById('saved-quiz-list');
            select.innerHTML = ""; list.innerHTML = "";
            if(snap.val()) Object.entries(snap.val()).forEach(([id, s]) => {
                select.innerHTML += `<option value="${id}">${s.title}</option>`;
                list.innerHTML += `<div style="margin-bottom:8px;">• ${s.title} <button onclick="deleteQuizSet('${id}')" style="padding:2px 5px; background:var(--red); color:white; border-radius:4px;">삭제</button></div>`;
            });
        });
    };
    window.deleteQuizSet = (id) => remove(ref(db, `quizSets/${id}`));

    // --- 입장 로직 ---
    window.handleEntry = () => {
        currentRoom = document.getElementById('input-room').value;
        if(!currentRoom) return alert("방 번호 입력!");
        if(isTeacher) {
            const setId = document.getElementById('select-quiz-set').value; if(!setId) return alert("세트 선택!");
            onValue(ref(db, `quizSets/${setId}`), (snap) => {
                const data = snap.val();
                set(ref(db, `rooms/${currentRoom}`), { status: 'lobby', quizData: data });
                quizDataCache = data;
                showView('view-lobby');
                startTeacherSync();
            }, { onlyOnce: true });
        } else {
            myName = document.getElementById('input-name').value; if(!myName) return alert("이름 입력!");
            const uRef = push(ref(db, `rooms/${currentRoom}/users`)); myKey = uRef.key;
            onDisconnect(ref(db, `rooms/${currentRoom}/users/${myKey}`)).remove();
            set(uRef, { name: myName, currentIdx: -1, correct: 0 }); 
            showView('view-lobby');
            startStudentSync();
        }
    };

    // --- 교사용 제어 및 모니터링 ---
    window.openQuiz = () => {
        update(ref(db, `rooms/${currentRoom}`), { status: 'opened' });
        document.getElementById('btn-open-quiz').style.display = 'none';
        showView('view-progress');
    };

    window.triggerResults = () => {
        update(ref(db, `rooms/${currentRoom}`), { status: 'results' });
    };

    function startTeacherSync() {
        onValue(ref(db, `rooms/${currentRoom}/status`), snap => {
            if(snap.val() === 'results') {
                showView('view-results');
                renderResults();
            }
        });

        // 학생 목록 및 진행상황 실시간 렌더링
        onValue(ref(db, `rooms/${currentRoom}/users`), snap => {
            if(!quizDataCache) return;
            const users = snap.val() || {};
            const totalQ = quizDataCache.questions.length;
            
            // 로비 화면의 유저 리스트 업데이트 (대기 중)
            const lobbyList = document.getElementById('user-list'); lobbyList.innerHTML = "";
            
            // 진행 모니터링 보드 업데이트
            const board = document.getElementById('progress-board'); board.innerHTML = "";
            let columnsHTML = "";
            for(let i=0; i<=totalQ; i++) {
                let title = i === totalQ ? "완료" : `${i+1}번 문제`;
                columnsHTML += `<div class="prob-col" id="col-${i}"><h4>${title}</h4></div>`;
            }
            board.innerHTML = columnsHTML;

            let allFinished = true;
            let userCount = 0;

            Object.entries(users).forEach(([key, u]) => {
                userCount++;
                const circle = `<div class="user-circle" style="background:${getUserColor(key)}; width:50px; height:50px; font-size:0.6rem;">${u.name}</div>`;
                
                // 로비 배치
                lobbyList.innerHTML += `<div class="user-circle" style="background:${getUserColor(key)};">${u.name}</div>`;
                
                // 보드 배치
                let targetColIdx = u.currentIdx === -1 ? 0 : u.currentIdx;
                if (targetColIdx > totalQ) targetColIdx = totalQ;
                
                const colDiv = document.getElementById(`col-${targetColIdx}`);
                if(colDiv) colDiv.innerHTML += circle;

                if(u.currentIdx < totalQ) allFinished = false;
            });

            // 모두 완료 감지
            if(userCount > 0 && allFinished) {
                document.getElementById('teacher-result-area').style.display = 'block';
            } else {
                document.getElementById('teacher-result-area').style.display = 'none';
            }
        });
    }

    // --- 학생용 풀이 흐름 ---
    function startStudentSync() {
        // 퀴즈 데이터 캐싱
        onValue(ref(db, `rooms/${currentRoom}/quizData`), snap => {
            quizDataCache = snap.val();
            if(quizDataCache) document.getElementById('total-q-num').innerText = quizDataCache.questions.length;
        });

        onValue(ref(db, `rooms/${currentRoom}/status`), snap => {
            const s = snap.val();
            if(!s) { alert("방이 존재하지 않습니다."); location.reload(); return; }
            if(s === 'opened') {
                document.getElementById('lobby-msg').innerText = "선생님이 퀴즈를 오픈했습니다!";
                document.getElementById('student-start-area').style.display = 'block';
            } else if (s === 'results') {
                showView('view-results');
                renderResults();
            }
        });
    }

    window.startStudentQuiz = () => {
        myCurrentIdx = 0;
        update(ref(db, `rooms/${currentRoom}/users/${myKey}`), { currentIdx: 0 });
        showView('view-class');
        loadProblem();
    };

    function loadProblem() {
        if(!quizDataCache) return;
        const totalQ = quizDataCache.questions.length;
        
        // 퀴즈 모두 완료 시
        if (myCurrentIdx >= totalQ) {
            update(ref(db, `rooms/${currentRoom}/users/${myKey}`), { currentIdx: totalQ });
            showView('view-ended');
            return;
        }

        update(ref(db, `rooms/${currentRoom}/users/${myKey}`), { currentIdx: myCurrentIdx });
        document.getElementById('current-q-num').innerText = myCurrentIdx + 1;
        
        const q = quizDataCache.questions[myCurrentIdx];
        document.getElementById('problem-area').innerHTML = q.text;
        [0,1,2,3].forEach(i => {
            const btn = document.getElementById(`btn-c${i}`);
            btn.innerText = q.options[i] || "보기 없음";
            btn.disabled = false;
        });
        MathJax.typesetPromise();

        startVisualTimer(q.timeLimit);
    }

    function startVisualTimer(duration) {
        clearInterval(timerInterval);
        clearTimeout(explosionTimeout);
        
        const rope = document.getElementById('rope-ui');
        const text = document.getElementById('timer-sec-ui');
        
        // 밧줄 초기화
        rope.style.transition = 'none';
        rope.style.width = '100%';
        
        // 지연 후 애니메이션 시작
        setTimeout(() => {
            rope.style.transition = `width ${duration}s linear`;
            rope.style.width = '0%';
        }, 50);

        let timeLeft = duration;
        text.innerText = `${timeLeft}s`;

        timerInterval = setInterval(() => {
            timeLeft--;
            text.innerText = `${timeLeft}s`;
            if(timeLeft <= 0) clearInterval(timerInterval);
        }, 1000);

        // 시간 초과 시 폭발 처리
        explosionTimeout = setTimeout(() => {
            explodeAndNext();
        }, duration * 1000);
    }

    window.submitChoice = (idx) => {
        [0,1,2,3].forEach(i => document.getElementById(`btn-c${i}`).disabled = true);
        clearInterval(timerInterval);
        clearTimeout(explosionTimeout);

        const q = quizDataCache.questions[myCurrentIdx];
        const isCorrect = (q.answer === idx);

        if(isCorrect) {
            // 정답 수 증가 트랜잭션 (간단히 현재값 가져와서 업데이트)
            onValue(ref(db, `rooms/${currentRoom}/users/${myKey}/correct`), snap => {
                let currentScore = snap.val() || 0;
                update(ref(db, `rooms/${currentRoom}/users/${myKey}`), { correct: currentScore + 1 });
                nextProblem();
            }, { onlyOnce: true });
        } else {
            nextProblem();
        }
    };

    function explodeAndNext() {
        [0,1,2,3].forEach(i => document.getElementById(`btn-c${i}`).disabled = true);
        const overlay = document.getElementById('explosion-overlay');
        overlay.style.display = 'flex';
        
        setTimeout(() => {
            overlay.style.display = 'none';
            // 시간초과는 오답 처리이므로 점수 증가 없이 다음 문제로
            nextProblem();
        }, 1500); // 1.5초 폭발 이펙트 유지
    }

    function nextProblem() {
        myCurrentIdx++;
        loadProblem();
    }

    // --- 결과 및 정리 ---
    window.renderResults = () => {
        onValue(ref(db, `rooms/${currentRoom}`), (snap) => {
            const data = snap.val(); if(!data || !data.users) return;
            const totalQs = data.quizData.questions.length;
            
            let sorted = Object.values(data.users).sort((a,b) => (b.correct||0) - (a.correct||0));
            
            const p = document.getElementById('podium-area');
            const first = sorted[0] || {name:'-', correct:0};
            const second = sorted[1] || {name:'-', correct:0};
            const third = sorted[2] || {name:'-', correct:0};

            p.innerHTML = `
                <div class="step second"><div style="font-size:2rem;">🥈</div><div class="step-name">${second.name}</div><div class="step-score">${second.correct} / ${totalQs}</div></div>
                <div class="step first"><div style="font-size:3rem; margin-bottom:10px;">🥇</div><div class="step-name">${first.name}</div><div class="step-score">${first.correct} / ${totalQs}</div></div>
                <div class="step third"><div style="font-size:1.5rem;">🥉</div><div class="step-name">${third.name}</div><div class="step-score">${third.correct} / ${totalQs}</div></div>
            `;
            
            const tb = document.getElementById('result-tbody'); tb.innerHTML = "";
            sorted.forEach((u, i) => {
                tb.innerHTML += `<tr><td>${i+1}위</td><td>${u.name}</td><td>${u.correct||0}</td><td>${Math.round((u.correct||0)/totalQs*100)}%</td></tr>`;
            });
        }, { onlyOnce: true });
    };

    window.resetRoom = () => confirm("초기화?") && remove(ref(db, `rooms/${currentRoom}`)).then(() => location.reload());
    window.leaveRoom = () => { if(confirm("퇴장?")) { if(myKey) remove(ref(db, `rooms/${currentRoom}/users/${myKey}`)); location.reload(); }};

    if (isTeacher) { 
        document.getElementById('teacher-entry-options').style.display = 'block'; 
        document.getElementById('student-inputs-area').style.display = 'none'; 
        document.getElementById('teacher-set-selection').style.display = 'block'; 
        document.getElementById('btn-join').innerText = "방 생성하기"; 
        document.getElementById('teacher-controls').style.display = 'block'; 
        loadQuizSets();
    }
</script>
</body>
</html>
